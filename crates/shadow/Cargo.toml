[package]
name = "forma-shadow"
version = "0.1.0"
description = "Forma 形 · Shadow"
authors = ["mantou132"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519)
name = "forma_shadow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"
tauri-plugin-edge-to-edge = { git = "https://github.com/mantou132/tauri-plugin-edge-to-edge" }
